<body data-root="../">

<header class="top"><div class="wrap">
  <a class="brand" href="../"><img class="logo" src="../favicon.png" alt="SOLYA LIFE" width="42" height="42">光禾生活坊 <span class="caps">Guanghe</span></a>

  </nav>

<main class="wrap">
<section class="view" data-view="tools">
  <div class="poster p-slate sub">
    <div class="top-row caps"><span>05 / Tools</span><span>Know your numbers</span></div>
    <div class="mega two">Count<br>first</div>
    <h1 style="margin-top:clamp(34px,6vw,76px)">下單之前，先算一次、檢查一次</h1>
  </div>
  <div class="body">
    <div class="grid2">
      <div class="card" style="gap:16px">
        <h2>每件實際成本試算</h2>
        <p class="note">欄位裡是範例數字，請換成你拿到的報價。</p>
        <div class="fields">
          <div class="field"><label for="c-unit">報價單價（元）</label><input id="c-unit" type="number" min="0" value="280" inputmode="decimal"></div>
          <div class="field"><label for="c-qty">首批數量（件）</label><input id="c-qty" type="number" min="1" value="100" inputmode="numeric"></div>
          <div class="field"><label for="c-tool">印繡開版費（元）</label><input id="c-tool" type="number" min="0" value="2000" inputmode="decimal"></div>
          <div class="field"><label for="c-sample">打樣費合計（元）</label><input id="c-sample" type="number" min="0" value="2000" inputmode="decimal"></div>
          <div class="field"><label for="c-pack">每件吊牌與包材（元）</label><input id="c-pack" type="number" min="0" value="15" inputmode="decimal"></div>
          <div class="field"><label for="c-ship">運費與雜支（元）</label><input id="c-ship" type="number" min="0" value="800" inputmode="decimal"></div>
          <div class="field full"><label for="c-mult">售價倍率（售價 ÷ 成本）</label><input id="c-mult" type="number" min="1" step="0.1" value="3" inputmode="decimal"></div>
        </div>
        <div class="result" aria-live="polite">
          <div class="row"><span>首批總投入</span><span id="r-total"></span></div>
          <div class="row"><span>每件實際成本</span><span class="big" id="r-per"></span></div>
          <div class="row"><span>比報價單價高出</span><span id="r-gap"></span></div>
          <div class="row"><span>對應的建議售價</span><span id="r-price"></span></div>
        </div>
        <p class="note">倍率沒有標準答案，要看通路抽成和行銷費用。這是用來抓方向的估算。</p>
      </div>
      <div class="card" style="gap:16px">
        <h2>下單前自我檢查</h2>
        <ul class="checks" id="checks">
          <li><label><input type="checkbox" id="k1"><span>我能用一句話說出產品賣給誰、解決什麼問題</span></label></li>
          <li><label><input type="checkbox" id="k2"><span>我有參考圖或樣衣可以給工廠看</span></label></li>
          <li><label><input type="checkbox" id="k3"><span>我知道目標售價和可接受的成本上限</span></label></li>
          <li><label><input type="checkbox" id="k4"><span>首批數量就算賣得慢，資金也撐得住</span></label></li>
          <li><label><input type="checkbox" id="k5"><span>我預留了打樣修改的時間和費用</span></label></li>
          <li><label><input type="checkbox" id="k6"><span>我決定好顏色數量，知道每色要做幾件</span></label></li>
          <li><label><input type="checkbox" id="k7"><span>洗標、吊牌和包裝已經有安排</span></label></li>
          <li><label><input type="checkbox" id="k8"><span>我問過版型歸誰、修改怎麼算</span></label></li>
        </ul>
        <div class="result" aria-live="polite">
          <div class="row"><span>準備度</span><span class="big" id="k-score"></span></div>
          <p id="k-msg" class="note"></p>
        </div>
      </div>
    </div>
    <a class="next" href="../contact/"><span class="caps">Next / 06</span><strong>聯絡諮詢 →</strong></a>
  </div>
</section>
